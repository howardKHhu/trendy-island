    function renderPrivacy(lang) {
        const d = privacyI18n[lang] || privacyI18n.en;
        document.title = d.title + ' | Trendy Island';
        document.documentElement.lang = lang;
        document.getElementById('pp-title').textContent = d.title;
        document.getElementById('pp-updated').textContent = d.updated;
        document.getElementById('back-link').textContent = d.back;

        const content = document.getElementById('pp-content');
        content.innerHTML = '';

        d.sections.forEach(sec => {
            const h2 = document.createElement('h2');
            h2.style.cssText = 'font-family:Archivo,sans-serif;font-size:1rem;color:#ff8a00;letter-spacing:0.5px;margin:2rem 0 0.6rem;text-transform:uppercase;';
            h2.textContent = sec.h;
            content.appendChild(h2);

            sec.p.forEach(para => {
                const p = document.createElement('p');
                p.style.cssText = 'color:rgba(255,255,255,0.6);line-height:1.85;margin:0 0 0.8rem;font-size:0.95rem;';
                p.textContent = para;
                content.appendChild(p);
            });
        });
    }

    function changeLang(lang) {
        localStorage.setItem('preferredLang', lang);
        renderPrivacy(lang);
    }

    // Language detection (same priority as main site)
    const urlParams = new URLSearchParams(window.location.search);
    const langParam = urlParams.get('lang');
    const savedLang = localStorage.getItem('preferredLang');
    const browserLang = navigator.language.split('-')[0];
    const supportedLangs = ['zh', 'en', 'ja'];

    const finalLang =
        (langParam && supportedLangs.includes(langParam)) ? langParam :
        (savedLang && supportedLangs.includes(savedLang)) ? savedLang :
        supportedLangs.includes(browserLang) ? browserLang : 'en';

    renderPrivacy(finalLang);
    </script>
